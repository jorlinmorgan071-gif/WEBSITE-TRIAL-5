<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0808">
<title>ForkFeed — TikTok for your kitchen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍳</text></svg>">
<style>
/* ForkFeed — dark cinematic theme, coral/amber accents, glassmorphism */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0a0808; --bg2:#141012; --surface:#1a1518; --surface2:#231c20;
  --glass:rgba(26,21,24,.72); --glass2:rgba(35,28,32,.6);
  --text:#f5f0ee; --muted:#a89b96; --faint:#6e625d;
  --coral:#ff5c5c; --coral2:#ff7e6a; --amber:#ffb86b; --gold:#ffd166;
  --green:#5ad48a; --red:#ff6b6b; --blue:#6ec3ff;
  --radius:18px; --radius-sm:12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  background:#000; color:var(--text); overflow:hidden;
}
img{display:block;}
::-webkit-scrollbar{width:0;height:0;}
.no-scroll{overflow:hidden;touch-action:none;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--text);}
input::placeholder,textarea::placeholder{color:var(--faint);}

/* ===== App shell (iPhone-in-browser) ===== */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% -10%,#1c1416 0%,#000 70%);}
#phone{position:relative;width:100%;height:100%;max-width:426px;background:var(--bg);overflow:hidden;}
@media(min-width:700px) and (min-height:760px){
  #phone{border-radius:47px;box-shadow:0 0 0 11px #16141a,0 0 0 13px #34303a,0 30px 90px rgba(0,0,0,.9);height:min(92vh,880px);}
  .desktop-only{display:flex!important;}
}
.desktop-only{display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:400;gap:8px;align-items:center;pointer-events:none;}
.desktop-only .dot{width:7px;height:7px;border-radius:50%;background:#2b2731;}
#notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:30px;border-radius:16px;background:#000;z-index:400;pointer-events:none;display:none;}
@media(min-width:700px) and (min-height:760px){#notch{display:block;}}
#statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:12px 26px 0;z-index:300;pointer-events:none;font-size:13px;font-weight:600;color:var(--text);}
#statusbar .sb-right{display:flex;gap:5px;align-items:center;}
.sb-batt{width:23px;height:11px;border:1.4px solid rgba(255,255,255,.5);border-radius:3px;position:relative;}
.sb-batt::after{content:'';position:absolute;inset:1.5px;right:60%;background:var(--text);border-radius:1px;}

/* ===== Screens & pages ===== */
#app{position:absolute;inset:0;display:flex;flex-direction:column;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}
.fade-in{animation:fade .28s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:96px;}
.page-nopad{padding-bottom:96px;}

/* ===== Top bar ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:54px 18px 10px;position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(10,8,8,.96) 55%,rgba(10,8,8,.7) 80%,transparent);}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:.2px;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px;}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.iconbtn:active{transform:scale(.92);}
.topbar .spacer{flex:1;}

/* ===== Bottom tab bar ===== */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:220;display:flex;padding:8px 10px calc(10px + var(--safe-b));background:linear-gradient(0deg,rgba(10,8,8,.98) 60%,rgba(10,8,8,.86));border-top:1px solid rgba(255,255,255,.06);justify-content:space-around;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;position:relative;color:var(--faint);transition:color .2s;}
.tabbtn .t-ico{font-size:21px;line-height:1;filter:grayscale(.4);}
.tabbtn span{font-size:10px;font-weight:600;letter-spacing:.2px;}
.tabbtn.active{color:var(--coral);}
.tabbtn.active .t-ico{filter:none;transform:scale(1.08);}
.tabbtn .badge{position:absolute;top:-1px;right:calc(50% - 21px);min-width:16px;height:16px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ===== Feed (TikTok style) ===== */
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#000;}
#feed::-webkit-scrollbar{display:none;}
.feedcard{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;}
.feedcard .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.12) contrast(1.05);transform:scale(1.02);}
.feedcard .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 22%,transparent 42%,rgba(0,0,0,.88) 100%);}
.feedcard .info{position:absolute;left:16px;right:88px;bottom:110px;z-index:5;}
.fd-title{font-size:21px;font-weight:800;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.6);}
.fd-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:600;color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.chip.live{background:rgba(255,70,70,.92);animation:pulse 1.6s infinite;}
.chip.gold{background:rgba(255,177,72,.22);border-color:rgba(255,184,107,.45);color:var(--amber);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,80,80,.55)}70%{box-shadow:0 0 0 9px rgba(255,80,80,0)}100%{box-shadow:0 0 0 0 rgba(255,80,80,0)}}
.fd-creator{display:flex;align-items:center;gap:9px;margin-top:11px;}
.avatar{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);object-fit:cover;background:var(--surface2);}
.avatar.lg{width:84px;height:84px;}
.fd-creator .who{font-size:14px;font-weight:700;}
.fd-creator .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.followbtn{margin-left:6px;padding:6px 13px;border-radius:18px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;transition:.25s;}
.followbtn.following{background:rgba(255,255,255,.14);}
.followbtn:active{transform:scale(.93);}
.rail{position:absolute;right:12px;bottom:118px;z-index:6;display:flex;flex-direction:column;gap:17px;align-items:center;}
.railbtn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;}
.railbtn .rb-ico{width:46px;height:46px;border-radius:50%;background:rgba(20,16,18,.62);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:21px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .18s;}
.railbtn:active .rb-ico{transform:scale(.86);}
.railbtn span{font-size:10.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7);}
.railbtn.liked .rb-ico{color:var(--coral);}
.railbtn.liked .rb-ico .heart{animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.fd-tabs{position:absolute;top:52px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:5;padding:0 16px;}
.fd-tab{padding:7px 15px;border-radius:20px;font-size:13px;font-weight:700;color:rgba(255,255,255,.55);}
.fd-tab.active{color:#fff;background:rgba(255,255,255,.14);}
.swipe-hint{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;color:rgba(255,255,255,.5);animation:bob 1.8s infinite;display:flex;flex-direction:column;align-items:center;gap:2px;}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
.heartburst{position:absolute;font-size:84px;z-index:20;pointer-events:none;filter:drop-shadow(0 6px 20px rgba(255,60,60,.6));animation:burst .9s ease forwards;}
@keyframes burst{0%{transform:scale(0) rotate(-16deg);opacity:0}30%{transform:scale(1.25) rotate(8deg);opacity:1}70%{opacity:1}100%{transform:scale(1.6) rotate(14deg) translateY(-40px);opacity:0}}
/* YouTube mode cards */
.yt-card{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;}
.yt-card .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;filter:blur(2px) saturate(1.1);}
.yt-embed{position:relative;z-index:2;width:100%;aspect-ratio:16/9;max-height:70%;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;}
.yt-embed iframe{width:100%;height:100%;border:0;}
.yt-info{position:absolute;left:16px;right:16px;bottom:104px;z-index:3;}

/* ===== Sheets (slide-up modals) ===== */
.sheet-wrap{position:absolute;inset:0;z-index:340;display:none;}
.sheet-wrap.open{display:block;}
.sheet-veil{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s;}
.sheet-wrap.open .sheet-veil{opacity:1;}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:linear-gradient(180deg,var(--surface) 0%,#131013 100%);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(103%);transition:transform .42s cubic-bezier(.32,.72,.28,1);box-shadow:0 -18px 60px rgba(0,0,0,.6);}
.sheet-wrap.open .sheet{transform:none;}
.sheet-grab{padding:9px 0 3px;display:flex;justify-content:center;}
.sheet-grab i{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);}
.sheet-head{display:flex;align-items:center;gap:12px;padding:6px 16px 12px;}
.sheet-head .sh-txt{flex:1;min-width:0;}
.sheet-head h2{font-size:19px;font-weight:800;line-height:1.25;}
.sheet-head .sh-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sheet-body{overflow-y:auto;padding:0 16px 30px;-webkit-overflow-scrolling:touch;}
.sheet-actions{display:flex;gap:8px;}
.close-x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}

/* Segmented tabs inside sheets */
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:13px;padding:4px;gap:3px;margin:4px 0 12px;}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.2s;}
.seg button.active{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(255,92,92,.35);}

/* ===== Cards & grids ===== */
.card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.rec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.rec-card{position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid rgba(255,255,255,.06);}
.rec-card:active{transform:scale(.97);transition:.15s;}
.rec-card img{width:100%;aspect-ratio:4/3.4;object-fit:cover;}
.rec-card .rc-ov{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);}
.rec-card .rc-t{font-size:13px;font-weight:800;line-height:1.25;}
.rec-card .rc-m{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;}
.row-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:11px;margin-bottom:10px;}
.row-card img{width:86px;height:72px;border-radius:12px;object-fit:cover;flex:none;}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:15px;font-size:14.5px;font-weight:700;transition:transform .16s, box-shadow .2s;background:var(--coral);color:#fff;box-shadow:0 8px 22px rgba(255,92,92,.3);}
.btn:active{transform:scale(.96);}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;color:var(--text);}
.btn.amber{background:var(--amber);color:#241505;box-shadow:0 8px 22px rgba(255,184,107,.28);}
.btn.green{background:var(--green);color:#0b2015;box-shadow:0 8px 22px rgba(90,212,138,.28);}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:12px;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btnrow{display:flex;gap:9px;}
.btnrow .btn{flex:1;}

/* Forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--amber);margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px;}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px 13px;font-size:14px;color:var(--text);outline:none;resize:vertical;transition:border .2s;}
.field input:focus,.field textarea:focus{border-color:var(--coral);}
.field textarea{min-height:80px;}
.hint{font-size:11px;color:var(--faint);margin-top:4px;}

/* Pills */
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;}
.pill{flex:none;padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:12px;font-weight:700;color:var(--muted);transition:.2s;white-space:nowrap;}
.pill.active{background:var(--coral);color:#fff;border-color:transparent;}
.pill.gold.active{background:var(--amber);color:#241505;}

/* Ingredient rows & steps */
.ing-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.045);margin-bottom:7px;border:1px solid rgba(255,255,255,.05);}
.ing-row.done .ing-name{text-decoration:line-through;color:var(--faint);}
.ing-row .ing-name{flex:1;font-size:14px;}
.ing-row .ing-qty{font-size:13px;font-weight:800;color:var(--amber);white-space:nowrap;}
.cbx{width:24px;height:24px;border-radius:8px;border:1.6px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;transition:.2s;}
.cbx.on{background:var(--green);border-color:var(--green);color:#08281a;}
.subst{display:block;font-size:11.5px;color:var(--green);margin-top:3px;font-style:italic;}
.step-row{display:flex;gap:11px;margin-bottom:12px;}
.step-num{flex:none;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--coral2));display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;}
.step-txt{font-size:14px;line-height:1.55;color:var(--text);}
.step-txt b{color:var(--amber);}

/* Serving scaler */
.scaler{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border-radius:16px;padding:9px 13px;margin-bottom:12px;justify-content:center;}
.scaler .sbtn{width:37px;height:37px;border-radius:50%;background:rgba(255,255,255,.1);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.scaler .sbtn:active{background:var(--coral);}
.scaler .sv{font-size:15px;font-weight:800;min-width:96px;text-align:center;}
.scaler .sv small{display:block;font-size:10px;color:var(--muted);font-weight:600;}

/* Nutrition bars */
.nutri-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.nutri-row .nl{width:86px;font-size:12px;color:var(--muted);font-weight:600;flex:none;}
.nutri-row .nbar{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;}
.nutri-row .nfill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,.9,.3,1);}
.nutri-row .nv{width:64px;text-align:right;font-size:12.5px;font-weight:800;flex:none;}
.health-score{display:flex;align-items:center;gap:13px;background:rgba(90,212,138,.1);border:1px solid rgba(90,212,138,.25);border-radius:15px;padding:12px;margin-bottom:14px;}
.hs-ring{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;position:relative;background:conic-gradient(var(--green) calc(var(--v)*1%),rgba(255,255,255,.09) 0);}
.hs-ring::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#141013;}

/* ===== Toasts ===== */
#toasts{position:absolute;top:56px;left:0;right:0;z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;max-width:360px;background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:11px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:toastIn .38s cubic-bezier(.21,1,.32,1) both;position:relative;overflow:hidden;}
.toast.out{animation:toastOut .3s ease both;}
.toast .t-ico{font-size:20px;flex:none;}
.toast .t-tt{font-size:13px;font-weight:800;}
.toast .t-ms{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4;}
.toast .t-bar{position:absolute;left:0;bottom:0;height:2.5px;background:var(--coral);animation:tbar linear forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes tbar{from{width:100%}to{width:0}}

/* ===== AI chat overlay ===== */
#aiwrap{position:absolute;inset:0;z-index:420;display:none;}
#aiwrap.open{display:flex;}
#aiwrap .ai-veil{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.ai-card{position:absolute;left:10px;right:10px;top:64px;bottom:86px;background:linear-gradient(180deg,#1d1719,#141013);border:1px solid rgba(255,255,255,.1);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:aiIn .45s cubic-bezier(.2,.9,.27,1) both;}
@keyframes aiIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.ai-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.07);}
.ai-orb{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 210deg,var(--coral),var(--amber),#ff9ac1,var(--coral));display:flex;align-items:center;justify-content:center;font-size:18px;animation:spin 7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-head .ai-tt{font-size:15px;font-weight:800;}
.ai-head .ai-sub{font-size:10.5px;color:var(--amber);font-weight:600;}
.ai-msgs{flex:1;overflow-y:auto;padding:13px 14px;display:flex;flex-direction:column;gap:11px;}
.msg{max-width:86%;padding:10px 13px;border-radius:17px;font-size:13.5px;line-height:1.55;animation:fade .3s ease both;}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--coral),#e8494f);border-bottom-right-radius:5px;color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:5px;}
.msg.ai.thinking{color:var(--muted);font-style:italic;}
.typing{display:inline-flex;gap:4px;align-items:center;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:blink 1.1s infinite;}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1.1)}}
.ai-presets{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 4px;}
.ai-preset{flex:none;padding:7px 12px;border-radius:16px;background:rgba(255,184,107,.13);border:1px solid rgba(255,184,107,.3);font-size:11.5px;font-weight:700;color:var(--amber);white-space:nowrap;}

// helpers
const fmtK = n => n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function timeAgo(ts){ const s=(Date.now()-ts)/1e3; if(s<60)return 'just now'; const m=s/60; if(m<60)return Math.floor(m)+'m ago'; const h=m/60; if(h<24)return Math.floor(h)+'h ago'; return Math.floor(h/24)+'d ago'; }
function scaleQty(q, base, target){ const r = target/base; const v = q*r; if(Number.isInteger(v)) return v+''; return (Math.round(v*100)/100)+''; }

function toggleLike(id, el){
  const r = S.recipes.find(x=>x.id===id); if(!r) return;
  const nowLiked = !S.liked[id];
  if(nowLiked){ S.liked[id]=1; r.likes++; burstHeart(el); }
  else { delete S.liked[id]; r.likes--; }
  save();
  if(el){ el.closest('.railbtn')?.classList.toggle('liked', nowLiked); const c=el.closest('.railbtn')?.querySelector('span'); if(c) c.textContent=fmtK(r.likes); }
  const c2 = document.querySelector(`#feedcard-${id} .like-count`); if(c2) c2.textContent = fmtK(r.likes);
}

  const card = el.closest('.feedcard, .yt-card, .rec-card') || $('#app');
  const h = document.createElement('div'); h.className='heartburst'; h.textContent='❤️';
  const rect = el.getBoundingClientRect(); const cardR = card.getBoundingClientRect();
  h.style.left = (rect.left-cardR.left + rect.width/2 - 42)+'px';

// ---------- ingredient scaling ----------
function scaledIngredients(recipe, servings){
  return recipe.ingredients.map(i=>({...i, disp: scaleQty(i.qty, recipe.servings, servings)}));
}

// ---------- grocery list builder ----------
function groceryListFrom(plan){
  // plan: {dayKey:{breakfast:recipeId|idString}}
  const totals = {};
  Object.values(plan).forEach(day=>{ Object.values(day).forEach(rid=>{
    const r = typeof rid==='string' ? S.recipes.find(x=>x.id===rid) : rid;
    if(!r) return;
    r.ingredients.forEach(ing=>{
      const key = ing.name.toLowerCase();
      if(!totals[key]) totals[key]={name:ing.name, unit:ing.unit||'', qty:0};
      totals[key].qty += Number(ing.qty)||0;
    });
  });});
  return Object.values(totals).sort((a,b)=>a.name.localeCompare(b.name));
}

// ---------- share image card (canvas) ----------
async function shareRecipeCard(recipe){
  toast('🎨','Building your card…','Rendering a social-ready image.', 1600);
  const W=1080,H=1350;
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d');
  // bg
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#171215'); g.addColorStop(1,'#0a0808');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // photo
  try{
    const img = await loadImg(recipe.image);
    const iw=img.width, ih=img.height; const tgt= W/ih;
    x.save(); x.beginPath(); x.roundRect(60,150,W-120,640,36); x.clip();

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function wrapText(ctx, txt, x, y, maxW, lh, maxLines){
  const words=txt.split(' '); let line='', lines=[];
  words.forEach(w=>{ const t=line+w+' '; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w+' '; } else line=t; });
  lines.push(line); if(lines.length>maxLines) lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l.trim(),x,y+i*lh));
  return y+lines.length*lh;
}
if(!CanvasRenderingContext2D.prototype.roundRect){

}

// ---------- AI engine ----------
const AI_SYS = 'You are ForkFeed\'s AI Chef inside a cooking app. You know food science, technique, substitutions, nutrition and grocery pricing. Answer helpfully, practically, and with warmth. Keep answers compact (under 130 words) unless asked for a full recipe. Use metric-friendly quantities. If asked about a dish in context, reference its actual ingredients.';

function builtinChefReply(msg, ctx){
  const m = msg.toLowerCase();
  const rec = ctx && ctx.recipe;
  const tone = S.ai.tone || 'warm';
  const tonePrefix = {warm:'Of course — ', gordon:'Right, LISTEN. ', sensei:'', hype:'YESSS! ', grandma:'Ah, sweetheart — '}[tone]||'';
  const joke = 'Why did the chef quit? They just couldn\'t take the heat... but you can. 🍳';
  if(rec){
    if(m.includes('ingredient')||m.includes('need')){
      return `${tonePrefix}for ${rec.title} you'll need: ${rec.ingredients.slice(0,6).map(i=>`${i.qty} ${i.unit? i.unit+' ':''}${i.name.split(',')[0]}`).join('; ')}${rec.ingredients.length>6?`, and ${rec.ingredients.length-6} more (see the Ingredients tab)`:''}. Tap Shop Ingredients and I'll route you to a grocer in your country.`;
    }
    if(m.includes('step')||m.includes('how')){
      return `${tonePrefix}the flow is: ${rec.steps.slice(0,3).map((s,i)=>`(${i+1}) ${s.split('.')[0].toLowerCase()}`).join(' → ')} … full ${rec.steps.length}-step guide is in the Steps tab. Want me to guide you live on camera? Tap Chef → AI Live.`;
    }
    if(m.includes('calor')||m.includes('nutrition')||m.includes('healthy')){
      const n=rec.nutrition; return `${tonePrefix}${rec.title} lands at ~${n.cal} kcal per serving — ${n.protein}g protein, ${n.carbs}g carbs, ${n.fat}g fat, ${n.fiber}g fiber. Health score ${healthScore(n)}/100. ${n.sodium>1000?'Watch the sodium — season at the table instead of the pan.':'Solid, balanced plate.'}`;
    }
    if(m.includes('joke')) return joke;
    if(m.includes('cost')||m.includes('price')||m.includes('estimat')) return `${tonePrefix}rough estimate: ${rec.ingredients.length} ingredients ≈ $${(rec.ingredients.length*3.2).toFixed(0)}–${(rec.ingredients.length*4.5).toFixed(0)} total, about $${(rec.ingredients.length*3.7/rec.servings).toFixed(1)} per serving depending on your market. Tap "Shop Ingredients" for live prices at a grocer near you.`;
  }
  if(m.includes('joke')) return joke;
  if(m.includes('20-minute')||m.includes('quick')){
    const quick = S.recipes.filter(r=>!r.live && r.time<=25);
    return `${tonePrefix}try ${quick[0]?.title||'True Carbonara'} (${quick[0]?.time||20} min) — pantry-friendly and fast. Or tell me what's in your fridge and I'll match something faster.`;
  }
  if(m.includes('have')||m.includes('fridge')||m.includes('leftover')){
    return `${tonePrefix}list what's in your fridge (even messy: "eggs, old bread, half an onion") and I'll match it against the ${S.recipes.length} recipes in your feed and scale servings to what you have.`;
  }
  if(m.includes('hello')||m.includes('hi ')||m==='hi'||m.includes('hey')) return `${tonePrefix}I'm your ForkFeed chef. Ask me to build a grocery list, scale servings, swap an ingredient for your diet, price a dish, or coach you live while you cook.`;
  return `${tonePrefix}I can plan meals, scale recipes, find substitutions (gluten-free, dairy-free, vegan, keto), estimate cost per serving, or coach you through ${rec?rec.title:'any recipe'} step by step with the Voice Chef. What are we cooking?`;
}
function healthScore(n){
  let s=50;
  s += Math.min(20, (n.protein||0)/2); s += Math.min(12,(n.fiber||0)*1.5);
  s -= Math.min(15, Math.max(0,(n.cal-500))/20); s -= Math.min(12, Math.max(0,(n.sodium-600))/60); s -= Math.min(10,(n.sugar||0)/5);
  return Math.max(5, Math.min(99, Math.round(s)));
}

// ---- provider dispatch ----
async function aiChat(userMsg, ctx, onToken){
  const conf = S.ai; const provider = conf.provider;
  const tone = TONE_PRESETS.find(t=>t.id===conf.tone)||TONE_PRESETS[0];
  const sys = AI_SYS + ' TONE: ' + tone.style;
  const ctxLine = ctx && ctx.recipe ? `\n[Context: user is viewing "${ctx.recipe.title}" — ${ctx.recipe.cuisine}, ${ctx.recipe.time} min, ingredients: ${ctx.recipe.ingredients.map(i=>i.name).slice(0,6).join(', ')}]` : '';
  const messages = [{role:'system',content:sys+ctxLine},{role:'user',content:userMsg}];
  if(provider==='openai' && conf.keys.openai){
    const r = await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+conf.keys.openai},body:JSON.stringify({model:conf.model,messages,max_tokens:400})});
    if(!r.ok) throw new Error('OpenAI '+r.status);
    const j = await r.json(); return j.choices[0].message.content;
  }
  if(provider==='openrouter' && conf.keys.openrouter){
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+conf.keys.openrouter},body:JSON.stringify({model:conf.model,messages,max_tokens:400})});
    if(!r.ok) throw new Error('OpenRouter '+r.status);
    const j = await r.json(); return j.choices[0].message.content;
  }
  if(provider==='ollama'){
    try{
      const r = await fetch('http://localhost:11434/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:conf.model==='custom'?(conf.keys.ollamaModel||'llama3.2'):conf.model,messages,stream:false})});
      if(!r.ok) throw new Error('Ollama '+r.status);
      const j = await r.json(); return j.message.content;
    }catch(e){
      return '⚠️ Could not reach Ollama at localhost:11434. Make sure `ollama serve` is running and you pulled a model (e.g. `ollama pull llama3.2`). Meanwhile, here is my built-in take:\n\n'+builtinChefReply(userMsg, ctx);
    }
  }
  if(provider==='gemini' && conf.keys.gemini){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${conf.model}:generateContent?key=${conf.keys.gemini}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:sys+ctxLine+'\nUser: '+userMsg}]}]})});
    if(!r.ok) throw new Error('Gemini '+r.status);
    const j = await r.json(); return j.candidates[0].content.parts[0].text;
  }
  // builtin
  await new Promise(r=>setTimeout(r, 620+Math.random()*500));
  return builtinChefReply(userMsg, ctx);
}

      </div>`;
    });
    html += `<div class="yt-card" style="display:block;padding:70px 26px;text-align:center">
      <div style="font-size:38px">🔑</div><div style="font-size:17px;font-weight:800;margin:10px 0 6px">Unlock real YouTube search</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6">Paste your YouTube Data API key in <b>Profile 🛡️ Privacy</b> to search all of YouTube from this feed. Get a free key at console.cloud.google.com → Enable YouTube Data API v3 → Credentials → Create API key.</div>
      <button class="btn sm" style="margin:14px auto 0" onclick="go('profile');setTimeout(()=>openSheet('sheet-privacy'),350)">Open Privacy →</button>
    </div>`;
    return html;
  }
  // if key exists, use real API search results stored in S.ytResults
  (S.ytResults||[]).forEach(v=>{
    html += `
    <div class="yt-card">
      <div class="yt-embed"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0" title="${esc(v.title)}" allowfullscreen></iframe></div>

    </div>`;
  });
  if(!(S.ytResults||[]).length) html += ytSearchBarHTML();
  return html;
}
function ytSearchBarHTML(){
  return `<div class="yt-card" style="display:block;padding:64px 26px;text-align:center">
    <div style="font-size:38px">🔎</div><div style="font-size:17px;font-weight:800;margin:10px 0 6px">Search YouTube</div>
    <div class="searchbar" style="margin:0"><input id="yt-q" placeholder="Search any cooking video…" onkeydown="if(event.key==='Enter')ytSearch()"><button class="btn sm" style="padding:8px 14px" onclick="ytSearch()">Go</button></div>
  </div>`;
}
async function ytSearch(){
  const q = $('#yt-q')?.value?.trim(); if(!q) return;
  const key = S.ai.keys.youtube;
  if(!key){ toast('🔑','No YouTube API key','Add one in Privacy → API keys to search live.'); return; }
  toast('🔎','Searching YouTube…','“'+q+'”');
  try{
    const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&type=video&q=${encodeURIComponent(q)}&key=${key}`);
    const j = await r.json();
    if(j.error) throw new Error(j.error.message);
    S.ytResults = (j.items||[]).map(it=>({id:it.id.videoId,title:it.snippet.title,ch:it.snippet.channelTitle,thumb:it.snippet.thumbnails?.high?.url}));
    save(); renderFeed();
  }catch(e){ toast('⚠️','YouTube search failed',e.message.slice(0,80), 5000, '#ff6b6b'); }
}
function saveBookmark(id,title,ch){
  if(S.bookmarks.some(b=>b.id===id)){ toast('ℹ️','Already saved','In your Cookbook → Watch Later.'); return; }
  S.bookmarks.unshift({id,title,ch}); save(); toast('🔖','Saved to Watch Later','Find it in Cookbook → Watch Later tab.');

function nutritionVerdict(r){
  const n=r.nutrition; const h=healthScore(n);
  if(h>=75) return `A genuinely strong plate: ${n.protein}g protein anchors it and fiber is respectable. Good for everyday rotation.`;
  if(h>=55) return `Balanced but watch portion — calories run ${n.cal>600?'high':''}${n.sodium>900?' and sodium is up there':''}. Fine for training days.`;
  return `Treat-yourself territory: ${n.cal} kcal with ${n.fat}g fat${n.sugar>20?' and a sugar hit':''}. Pair with a lighter day around it.`;
}
function subsFor(name){
  const k = name.toLowerCase();
  for(const key in SUBSTITUTIONS){ if(k.includes(key)) return SUBSTITUTIONS[key].slice(0,2).join(' or '); }
  // vegan / keto generic
  if(SUBSTITUTIONS[k]) return SUBSTITUTIONS[k][0];
  if(RS.diet==='vegan' && /butter|cream|cheese|egg|milk|yogurt|bacon|chicken|beef|pork/i.test(name)) return 'plant-based alternative';
  if(RS.diet==='gf' && /flour|noodle|pasta|tortilla|bread|soy sauce/i.test(name)) return 'certified gluten-free swap';
  if(RS.diet==='keto' && /sugar|rice|potato|flour|noodle/i.test(name)) return 'low-carb alternative';
  return null;
}

  const sortEl=$('#discover-sort');
  if(sortEl && !sortEl.children.length){ sortEl.innerHTML = sorts.map(s=>`<button class="pill gold ${DIS.sort===s[0]?'active':''}" onclick="DIS.sort='${s[0]}';renderDiscover()">${s[1]}</button>`).join(''); }
  let recs = S.recipes.filter(r=>!r.live);
  if(DIS.cuisine!=='All') recs = recs.filter(r=>r.cuisine===DIS.cuisine);

  if(DIS.sort==='new') recs.sort((a,b)=>(b.created||0)-(a.created||0)||a.title.localeCompare(b.title));

async function scanPhotoRecipe(ev){
  const f = ev.target.files[0]; if(!f) return;
  const out = $('#cr-scan-result');
  out.innerHTML = `<div class="card"><div class="typing" style="display:flex;gap:5px;align-items:center"><i></i><i></i><i></i><span style="font-size:12.5px;color:var(--muted);margin-left:6px">Scanning photo…</span></div></div>`;
  const url = await fileToDataURL(f);
  await new Promise(r=>setTimeout(r,1500));
  const found = S.recipes[Math.floor(Math.random()*Math.min(4,S.recipes.length))];
  CR.scanPreview = {...JSON.parse(JSON.stringify(found)), id:'scan'+Date.now(), image:url, userMade:true, scynCurated:true};
  CR.scanPreview.title = guessTitleFromName(f.name) || ('AI Read: '+found.title);
  renderScanPreview(out, CR.scanPreview);
}
async function scanDocRecipe(ev){
  const f = ev.target.files[0]; if(!f) return;
  const out = $('#cr-doc-result');
  out.innerHTML = `<div class="typing" style="display:flex;gap:5px;align-items:center;margin-top:10px"><i></i><i></i><i></i><span style="font-size:12.5px;color:var(--muted);margin-left:6px">Reading document…</span></div>`;
  let text='';
  if(f.type.startsWith('text')||/\.(txt|md|csv|json)$/i.test(f.name)){ text = await f.text(); }
  const found = S.recipes[Math.floor(Math.random()*Math.min(4,S.recipes.length))];
  await new Promise(r=>setTimeout(r,1300));
  CR.scanPreview = {...JSON.parse(JSON.stringify(found)), id:'doc'+Date.now(), userMade:true, scynCurated:true, docText:text};
  if(text){ const lines = text.split('\n').map(l=>l.trim()).filter(Boolean); if(lines.length>3){ CR.scanPreview.title = (lines.find(l=>l.length<40 && !/^\d/.test(l))||CR.scanPreview.title); CR.scanPreview.steps = lines.filter(l=>l.length>10).slice(0,8); } }
  renderScanPreview(out, CR.scanPreview);
}
function renderScanPreview(out, rec){
  out.innerHTML = `
  <div class="card">
    <img src="${rec.image}" style="width:100%;border-radius:12px;margin-bottom:10px;aspect-ratio:16/10;object-fit:cover">
    <div style="font-size:15px;font-weight:800">${esc(rec.title)}</div>
    <div style="font-size:11.5px;color:var(--muted);margin:3px 0 8px">${rec.cuisine} · ${rec.time} min · ${rec.difficulty} · serves ${rec.servings}</div>
    <div style="font-size:12px;color:var(--muted)">Ingredients: ${rec.ingredients.slice(0,4).map(i=>esc(i.name.split(',')[0])).join(' · ')}…</div>
    <div style="font-size:11px;color:var(--green);margin-top:8px;font-weight:700">✓ AI extracted with ${rec.steps.length} steps — correct?</div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn sm green" onclick="confirmScanRecipe()">✓ Post it</button>
      <button class="btn sm ghost" onclick="CR.mode='type';renderCreateSheet();setTimeout(()=>{$('#cr-title').value='${esc(rec.title)}'},50)">✍️ Edit first</button>
    </div>
  </div>`;
}
function guessTitleFromName(n){
  const base = n.replace(/\.[a-z0-9]+$/i,'').replace(/[_-]/g,' ');
  return base.length>3 && base.length<40 ? base.replace(/\b\w/g,c=>c.toUpperCase()) : null;
}
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function confirmScanRecipe(){
  if(!CR.scanPreview) return;
  const rec = CR.scanPreview;
  rec.creator='You'; rec.creatorHandle=S.user.handle; rec.likes=Math.floor(Math.random()*40); rec.commentsCount=0; rec.saves=0;
  rec.created=Date.now(); rec.ytId=''; rec.live=false;
  S.recipes.unshift(rec); S.user.scynRecipes++; save();
  closeSheet('sheet-create');
  pushNoti({ico:'⭐',title:'Posted via Scyn AI',msg:`${rec.title} is live on your profile and reshuffled into For You.`,group:'today'});
  toast('⭐','Recipe posted!','Scyn AI curated it onto the For You page with your shoutout.');
  renderFeed();
}
async function submitRecipe(){
  const title=$('#cr-title')?.value?.trim();
  if(!title){ toast('⚠️','Name your dish','At least a title so the AI can enhance it.'); return; }
  const ings=[]; for(let i=0;i<CR.ingCount;i++){ const n=$(`#cr-ing-n-${i}`)?.value?.trim(); if(n) ings.push({qty:Number($(`#cr-ing-q-${i}`)?.value)||1, unit:$(`#cr-ing-u-${i}`)?.value||'', name:n}); }
  if(!ings.length){ toast('⚠️','Add ingredients','Even one line works.'); return; }
  const steps=[]; for(let i=0;i<CR.stepCount;i++){ const s=$(`#cr-step-${i}`)?.value?.trim(); if(s) steps.push(s); }
  if(!steps.length){ toast('⚠️','Add steps','How do we cook this?'); return; }
  const btn=document.querySelector('#sheet-create .btn.block'); if(btn){ btn.textContent='⏳ AI enhancing thumbnail…'; btn.setAttribute('disabled',''); }
  await new Promise(r=>setTimeout(r,1400));
  let img = IMG.ramen;
  const photo = $('#cr-photo')?.files?.[0];
  if(photo){ img = await fileToDataURL(photo); }
  else { const pool=[IMG.tacos,IMG.butter,IMG.sushi,IMG.ramen,IMG.jollof]; img = pool[title.length % pool.length]; }
  const yt=$('#cr-yt')?.value||'';
  const ytId = (yt.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||[])[1]||'';
  const rec = {
    id:'u'+Date.now(), title, desc:$('#cr-desc')?.value||'Posted from your kitchen.', cuisine:$('#cr-cuisine')?.value||'American',
    time:Number($('#cr-time')?.value)||30, difficulty:$('#cr-diff')?.value||'Medium', servings:Number($('#cr-serv')?.value)||4,
    likes:Math.floor(Math.random()*60), commentsCount:0, saves:0, image:img, hashtags:['#homecook','#'+($('#cr-cuisine')?.value||'kitchen').toLowerCase()],
    ingredients:ings, steps, nutrition:{cal:Math.floor(300+Math.random()*400),protein:Math.floor(10+Math.random()*30),carbs:Math.floor(20+Math.random()*60),fat:Math.floor(8+Math.random()*40),fiber:Math.floor(1+Math.random()*8),sugar:Math.floor(1+Math.random()*20),sodium:Math.floor(300+Math.random()*800)},
    ytId, live:false, userMade:true, scynCurated:true, creator:'You', creatorHandle:S.user.handle, created:Date.now()
  };
  S.recipes.unshift(rec); S.user.scynRecipes++; save();
  closeSheet('sheet-create');
  pushNoti({ico:'⭐',title:'Recipe published',msg:`${title} went live with an AI-enhanced cover and your creator signature.`,group:'today'});
  toast('⭐','Recipe is live!','Scyn AI curated it onto For You with your signature + shoutout.', 4200);
  renderFeed(); go('cookbook');
}

let MP = {offset:0, dragId:null};
function plannerWeek(){ const out=[]; const now=new Date(); for(let d=0; d<7; d++){ const dt=new Date(now); dt.setDate(now.getDate()+d+MP.offset*7); const key=dt.toISOString().slice(0,10); out.push({key, dow:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()], date:dt.getDate(), month:dt.toLocaleString('en',{month:'short'})}); } return out; }
function renderPlanner(){
  $('#week-strip').innerHTML = plannerWeek().map((d,i)=>`
    <div class="day-tab ${i===0?'active':''}" data-day="${d.key}"><span class="d-nm">${d.dow}</span><span class="d-dt">${d.date}</span><span class="d-nm" style="color:var(--faint)">${d.month}</span></div>`).join('');
  $$('#week-strip .day-tab').forEach(t=>t.addEventListener('click',()=>{ $$('#week-strip .day-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); renderPlannerBody(t.dataset.day); }));
  renderPlannerBody(plannerWeek()[0].key);
}
function renderPlannerBody(dayKey){
  const day = S.mealPlan[dayKey] || {};
  const slots=[['breakfast','🍳 Breakfast'],['lunch','🥙 Lunch'],['dinner','🍝 Dinner']];
  const list = groceryListFrom(S.mealPlan);
  $('#planner-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin:2px 16px 12px">
      <button class="btn sm ghost" onclick="MP.offset--;renderPlanner()">‹ Prev</button>
      <div style="flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted)">Week of ${plannerWeek()[0].month} ${plannerWeek()[0].date} – ${plannerWeek()[6].date}</div>
      <button class="btn sm ghost" onclick="MP.offset++;renderPlanner()">Next ›</button>
    </div>
    <div class="sec-h" style="margin-top:2px"><h2 style="font-size:15px">${plannerWeek().find(d=>d.key===dayKey)?.dow} ${plannerWeek().find(d=>d.key===dayKey)?.date}</h2></div>
    <div style="padding:0 16px">
    ${slots.map(([k,label])=>{
      const rid = day[k]; const r = rid && S.recipes.find(x=>x.id===rid);
      return `<div class="slot ${r?'filled':''}" data-slot="${dayKey}:${k}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropToSlot(event,'${dayKey}','${k}')" onclick="pickSlot('${dayKey}','${k}')">
        <span class="slot-nm">${label}</span>
        ${r?`<span class="slot-ico"><img src="${r.image}" style="width:38px;height:38px;border-radius:10px;object-fit:cover"></span><span class="slot-rec">${esc(r.title)}</span><button class="iconbtn" style="width:30px;height:30px;font-size:12px" onclick="event.stopPropagation();clearSlot('${dayKey}','${k}')">✕</button>`
        :`<span class="slot-ico">＋</span><span class="slot-rec" style="color:var(--faint)">tap to pick · or drop a saved recipe here</span>`}
      </div>`;
    }).join('')}
    </div>
    <div class="sec-h"><h2>🛒 Week grocery list</h2><div class="more" onclick="exportGroceryPDF(groceryListFrom(S.mealPlan),'ForkFeed Weekly Grocery List')">📄 Export PDF</div></div>
    <div style="padding:0 16px">
    ${list.length? list.map(g=>`<div class="gro-row"><span class="g-n">${esc(g.name)}</span><span class="g-q">${g.qty}${g.unit?' '+g.unit:''}</span></div>`).join('')
      :`<div class="empty" style="padding:24px 30px"><div class="e-ico">🧺</div><div class="e-tt">Nothing planned yet</div><div style="font-size:12px">Fill slots and the merged, summed grocery list appears here.</div></div>`}
    </div><div style="height:24px"></div>`;
}
function pickSlot(dayKey, k){
  const w=$('#sheet-pick');
  w.querySelector('.sheet').innerHTML = `
  <div class="sheet-grab"><i></i></div>
  <div class="sheet-head"><div class="sh-txt"><h2>Pick a recipe</h2><div class="sh-sub">Slot: ${k} · ${dayKey}</div></div><button class="close-x" data-close="sheet-pick">✕</button></div>
  <div class="sheet-body">
    <div class="searchbar" style="margin:0 0 12px">🔍<input id="pick-q" placeholder="Filter…" oninput="filterPick(this.value)"></div>
    <div id="pick-list">${S.recipes.filter(r=>!r.live).map(r=>`
      <div class="row-card pickrow" draggable="true" data-pid="${r.id}" ondragstart="MP.dragId='${r.id}'">
        <img src="${r.image}" alt=""><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:800">${esc(r.title)}</div><div style="font-size:11px;color:var(--muted)">${r.time} min · serves ${r.servings}</div></div>
        <button class="btn sm" onclick="assignSlot('${dayKey}','${k}','${r.id}')">Pick</button>
      </div>`).join('')}</div>
  </div>`;
  bindSheetVeil('sheet-pick');
  w.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeSheet(b.dataset.close)));
  openSheet('sheet-pick');
}
function filterPick(q){ q=q.toLowerCase(); $$('#pick-list .pickrow').forEach(r=>r.style.display = r.textContent.toLowerCase().includes(q)?'flex':'none'); }
function assignSlot(dayKey,k,rid){
  if(!S.mealPlan[dayKey]) S.mealPlan[dayKey]={};
  S.mealPlan[dayKey][k]=rid; save();
  closeSheet('sheet-pick');
  const r=S.recipes.find(x=>x.id===rid);
  toast('🗓️','Planned','“'+r.title+'” for '+k+' — grocery list updated.', 3000, '#ffb86b');
  renderPlannerBody(dayKey);
}
function dropToSlot(ev, dayKey, k){ ev.preventDefault(); if(!MP.dragId) return; assignSlot(dayKey,k,MP.dragId); MP.dragId=null; }
function clearSlot(dayKey,k){ delete S.mealPlan[dayKey][k]; save(); renderPlannerBody(dayKey); toast('🗑️','Slot cleared','Grocery list re-summed.'); }

// =============== AI CHAT OVERLAY ===============
let AI = {ctx:null, msgs:[], busy:false, atts:[]};
function openAISheet(from, ctx){
  AI.ctx = ctx||null; AI.atts=[];
  if(!AI.msgs.length) AI.msgs = [{role:'ai', text:'Hey — I\'m your ForkFeed AI Chef. '+(ctx&&ctx.id?`I can see you're looking at “${S.recipes.find(r=>r.id===ctx.id)?.title}”. `:'')+'Ask me anything: scale a recipe, find swaps for your diet, price a dish, plan the week — or just tell me what\'s in your fridge.'}];
  renderAI();
  $('#aiwrap').classList.add('open');
  if(ctx&&ctx.id){ const r=S.recipes.find(x=>x.id===ctx.id); if(r) AI.msgs.push({role:'ai', text:`Context loaded: “${r.title}” — ${r.cuisine}, ${r.time} min, ${r.steps.length} steps, serves ${r.servings}. Fire away.`}); renderAI(); }
}
function closeAI(){ $('#aiwrap').classList.remove('open'); }
function renderAI(){
  const msgs=$('#ai-msgs');

async function aiSearchGo(){
  const q = $('#as-q').value.trim(); if(!q) return;
  AS.q=q;
  if(/^https?:\/\//i.test(q)){
    toast('🔗','Fetching link…','Reading the page for recipe data.',1800,'#6ec3ff');
    const rec = await extractRecipeFromURL(q);
    AS.urlResult = rec; renderAISearch();
    toast('✨','Recipe extracted','“'+rec.title+'” — tap Save & Enhance to keep it.');
    return;
  }
  // bit-by-bit narrowing
  const recs=S.recipes.filter(r=>!r.live);
  renderAISearch();
  for(let i=0;i<recs.length;i++){
    const r=recs[i];
    await new Promise(res=>setTimeout(res,260));
    const text=(r.title+' '+r.desc+' '+r.cuisine+' '+r.hashtags.join(' ')+' '+r.ingredients.map(x=>x.name).join(' ')+' '+r.steps.join(' ')).toLowerCase();
    const terms=q.toLowerCase().split(/[\s,]+/).filter(t=>t.length>2 && !['the','and','for','with','something','under','without','no'].includes(t));
    let score=0;
    terms.forEach(t=>{ if(text.includes(t)) score+=22; });
    if(/quick|fast|20|15|10/.test(q.toLowerCase()) && r.time<=30) score+=30;
    if(/creamy/.test(q.toLowerCase()) && /cream|cheese|butter/.test(text)) score+=25;
    score = Math.min(97, score + (i*7)%23);
    AS.scores[r.id]=score;
    const el=document.getElementById('as-'+r.id);
    if(el){
      el.style.opacity = score>45? 1 : .18;
      el.style.transform = score>45? 'scale(1)' : 'scale(.88)';
      el.style.filter = score>45? 'saturate(1.15)' : 'grayscale(1)';
      if(score>45 && !el.querySelector('.rc-t').textContent.includes('✨')){
        el.querySelector('.rc-m').insertAdjacentHTML('beforeend','<span>✨ '+score+'%</span>');
      }
    }
  }
  toast('✨','AI narrowed your feed',Object.values(AS.scores).filter(s=>s>45).length+' strong matches lit up.');
}
async function saveURLRecipe(){
  if(!AS.urlResult) return;

// =============== VOICE CHEF ===============
let VC = {rid:null, step:0, playing:false, timer:null, listening:false, recog:null};
function startVoiceChef(rid){
  VC.rid=rid; VC.step=0; VC.playing=false;
  renderVC();
  $('#voicewrap').classList.add('open');
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function endVoiceChef(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(VC.recog){ try{VC.recog.abort();}catch(e){} }
  clearInterval(VC.timer);
  VC.playing=false; VC.listening=false;
  $('#voicewrap').classList.remove('open');
  const r=S.recipes.find(x=>x.id===VC.rid);
  if(r && VC.step>0){ pushNoti({ico:'🍳',title:'Cooking session ended',msg:`You stopped at step ${Math.min(VC.step+1,r.steps.length)} of ${r.title}.`,group:'today'}); toast('🍳','Session saved','Resume anytime from the same step.'); }
}
function renderVC(){
  const r=S.recipes.find(x=>x.id===VC.rid); if(!r) return;
  const p = Math.round((VC.step)/r.steps.length*100);
  $('#vc-ring').style.setProperty('--p',p);
  $('#vc-ring span').textContent = ['🍳','🔥','🥘','🧂','✨'][VC.step%5];
  $('#vc-title').textContent = r.title;
  $('#vc-step').innerHTML = `Step ${VC.step+1} / ${r.steps.length}`;
  $('#vc-ins').textContent = r.steps[VC.step];
  $('#vc-fb').textContent = VC.step===0? 'Tap ▶ to begin — I\'ll read each step aloud and wait for you.' : 'Say or tap: next · repeat · back · what does it mean?';
}
function vcSpeak(txt){
  if(!window.speechSynthesis) { toast('🔇','No voice on this device','Text guidance still works.'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.rate=.95; u.pitch=1.02;
  const tone=S.ai.tone||'warm';
  if(tone==='gordon'){u.rate=1.18;u.pitch=.82;}
  if(tone==='sensei'){u.rate=.82;u.pitch=.9;}
  if(tone==='hype'){u.rate=1.28;u.pitch=1.24;}
  if(tone==='grandma'){u.rate=.88;u.pitch=1.12;}
  speechSynthesis.speak(u);
}
function vcPlayPause(){
  const r=S.recipes.find(x=>x.id===VC.rid); if(!r) return;
  if(VC.playing){ VC.playing=false; if(window.speechSynthesis)speechSynthesis.cancel(); clearInterval(VC.timer); $('#vc-play').textContent='▶'; renderVC(); return; }
  VC.playing=true; $('#vc-play').textContent='⏸';
  const tone=GREET_TONE();
  vcSpeak(tone + ' Step '+(VC.step+1)+'. '+r.steps[VC.step]);
  renderVC();
}
function GREET_TONE(){
  const t=S.ai.tone||'warm';
  return {warm:'Right, chef.', gordon:'Let\'s GO. Focus.', sensei:'Observe. Begin.', hype:'Here we GO! ', grandma:'Follow me, darling.'}[t]||'';
}
function vcNext(){
  const r=S.recipes.find(x=>x.id===VC.rid); if(!r) return;
  if(VC.step>=r.steps.length-1){
    vcSpeak(GREET_TONE()+' That\'s the final step — plate it and take a photo. You cooked it!');
    $('#vc-ins').textContent='🎉 Done — plated! Tap end to save the session.';
    $('#vc-fb').textContent='Chef congratulates you — session complete.';
    clearInterval(VC.timer);
    return;
  }
  VC.step++; renderVC();
  if(VC.playing) vcSpeak(GREET_TONE()+' Step '+(VC.step+1)+'. '+r.steps[VC.step]);
}
function vcRepeat(){ const r=S.recipes.find(x=>x.id===VC.rid); if(r){ vcSpeak(GREET_TONE()+' Step '+(VC.step+1)+'. '+r.steps[VC.step]); } }
function vcBack(){ if(VC.step>0){ VC.step--; renderVC(); if(VC.playing){const r=S.recipes.find(x=>x.id===VC.rid); vcSpeak(r.steps[VC.step]);} } }
function vcDefine(){
  const r=S.recipes.find(x=>x.id===VC.rid); if(!r) return;
  const s=r.steps[VC.step];
  const term = (s.match(/\b(saut[eé]|simmer|sear|braise|fold|whisk|emulsion|char|deglaze|marinate|flamb[eé]|reduce)\b/i)||[])[0];
  const defs={
    sauté:'Sauté = cook fast in hot fat, keep it moving.',
    simmer:'Simmer = gentle bubbles, just below a boil.',
    sear:'Sear = hard, dry heat to brown the surface fast.',
    braise:'Braise = sear first, then slow-cook in liquid.',
    fold:'Fold = combine gently with a spatula, top to bottom.',
    whisk:'Whisk = beat fast with a whisk to emulsify or aerate.',
    emulsion:'Emulsion = fat + water held together, like your carbonara sauce.',
    char:'Char = let it blacken slightly in spots for smoky flavour.',
    deglaze:'Deglaze = add liquid and scrape the brown bits into a sauce.',
    marinate:'Marinate = soak in seasoned liquid to tenderise and flavour.',
    flambé:'Flambé = burn off alcohol for flavour (careful!).',
    reduce:'Reduce = boil off water to concentrate the sauce.'
  };
  const ans = term? defs[term.toLowerCase()] : 'Ask me about any word in the step — e.g. “what does sauté mean?”';
  $('#vc-fb').textContent = ans;
  vcSpeak(ans);
}
function vcListen(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ toast('🔇','Voice input unsupported','This browser can\'t do mic capture — use the buttons instead.'); return; }
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(VC.recog){ try{VC.recog.abort();}catch(e){} }
  const rec = new SR(); rec.lang='en-US'; rec.continuous=false; rec.interimResults=false;
  VC.recog=rec;
  $('#vc-ring').classList.add('listening');
  rec.onresult = e=>{
    const said = e.results[0][0].transcript.toLowerCase();
    $('#vc-fb').textContent = '🗣️ “'+said+'”';
    if(/next|done|continue|finished/.test(said)) vcNext();
    else if(/repeat|again|say that/.test(said)) vcRepeat();
    else if(/back|previous/.test(said)) vcBack();
    else if(/mean|what is|what's|define|explain/.test(said)) vcDefine();
    else if(/stop|cancel|quit|end/.test(said)) endVoiceChef();
    else { vcSpeak('I heard: '+said+'. Say next, repeat, back, or ask what a word means.'); }
  };
  rec.onend = ()=> $('#vc-ring')?.classList.remove('listening');
  rec.onerror = ()=> { $('#vc-ring')?.classList.remove('listening'); };
  rec.start();
}

// =============== AI LIVE CAMERA GUIDE ===============
let CAM = {rid:null, step:0, conf:0, stream:null, timer:null, uncertain:0, img:null};
async function startCameraGuide(rid){
  CAM.rid=rid; CAM.step=0; CAM.conf=0; CAM.uncertain=0;
  $('#camwrap').classList.add('open');
  $('#cam-fb').textContent='Requesting camera…';
  try{
    CAM.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    $('#cam-video').srcObject = CAM.stream;
    $('#cam-fb').textContent='Camera on. Point it at your prep area.';
    camRenderStep();
    CAM.timer = setInterval(camAnalyze, 2500);
  }catch(e){
    $('#cam-fb').textContent='⚠️ Camera blocked or unavailable — you can still follow the steps manually below.';
    camRenderStep();
  }
}
function camRenderStep(){
  const r=S.recipes.find(x=>x.id===CAM.rid); if(!r) return;
  $('#cam-step').textContent = 'Step '+(CAM.step+1)+' of '+r.steps.length;
  $('#cam-ins').textContent = r.steps[CAM.step];
  $('#cam-prog i').style.width = (CAM.step/r.steps.length*100)+'%';
  $('#cam-conf').textContent = CAM.conf+'/2 confirmations';
}
async function camAnalyze(){
  const r=S.recipes.find(x=>x.id===CAM.rid); if(!r) return;
  const v=$('#cam-video');
  if(!v || !v.videoWidth){ // no frames — count as uncertain
    CAM.uncertain+=2.5;
  } else {
    // fake vision progress: brightness/motion heuristic on real frames
    try{
      const c=document.createElement('canvas'); c.width=64; c.height=36;
      c.getContext('2d').drawImage(v,0,0,64,36);
      const d=c.getContext('2d').getImageData(0,0,64,36).data;
      let lum=0; for(let i=0;i<d.length;i+=4){ lum+=d[i]*.299+d[i+1]*.587+d[i+2]*.114; }
      lum/=(d.length/4);
      const active = lum>28; // something visible in frame
      if(active){ CAM.conf++; CAM.uncertain=0; } else { CAM.uncertain+=2.5; }
    }catch(e){ CAM.uncertain+=2.5; }
  }
  $('#cam-fb').textContent = CAM.uncertain>10 ? 'I can\'t see the cooking area — point the camera at your work.' :
    CAM.conf>=2 ? '✅ Confirmed — advancing to the next step.' :
    CAM.conf===1 ? 'Looking good — hold steady, one more confirmation…' : 'Watching… show me the pan.';
  $('#cam-conf').textContent = Math.min(CAM.conf,2)+'/2 confirmations';
  // skip option after 30s uncertainty
  $('#cam-skip').style.display = CAM.uncertain>=30? 'inline-flex':'none';
  if(CAM.conf>=2){
    if(CAM.step < r.steps.length-1){ CAM.step++; CAM.conf=0; camRenderStep(); if(window.speechSynthesis) vcSpeak('Step '+(CAM.step+1)+'. '+r.steps[CAM.step]); }
    else { clearInterval(CAM.timer); $('#cam-ins').textContent='🎉 All steps confirmed — beautifully done!'; $('#cam-fb').textContent='Session complete. Chef is proud.'; $('#cam-prog i').style.width='100%'; if(window.speechSynthesis) vcSpeak('Every step confirmed. Plate it up — you earned it.'); }
  }

        <div class="vc-sub" id="vc-fb">Feedback</div>
        <div class="vc-sub" style="color:var(--faint);font-size:11px" id="vc-conf">0/2 confirmations</div>
      </div>
    </div>
    <div class="vc-btns">
      <button class="btn" id="vc-play" onclick="vcPlayPause()">▶</button>
      <button class="btn ghost" onclick="vcBack()">‹ Back</button>
      <button class="btn ghost" onclick="vcRepeat()">🔁 Repeat</button>
      <button class="btn ghost" onclick="vcListen()">🎤 Listen</button>
      <button class="btn ghost" onclick="vcDefine()">💬 Define</button>
      <button class="btn green" onclick="vcNext()">Next ›</button>
      <button class="btn ghost" onclick="endVoiceChef()">⏹ End</button>
    </div>
  </div>

  <!-- Camera guide -->
  <div id="camwrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <div class="cam-top">
      <button class="btn sm ghost" onclick="endCameraGuide()">✕ Exit</button>
      <span class="chip live" style="margin-left:auto">● AI LIVE</span>
    </div>
    <div class="cam-ov">
      <div class="cam-step" id="cam-step">STEP 1</div>
      <div class="cam-ins" id="cam-ins">Instruction</div>
      <div class="cam-fb" id="cam-fb">Feedback</div>
      <div class="cam-prog"><i id="cam-prog-fill" style="width:0"></i></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span class="chip" id="cam-conf">0/2 confirmations</span>
        <button class="btn sm ghost" onclick="camNarrate()">🔊 Narrate</button>
        <button class="btn sm" id="cam-skip" style="display:none;background:var(--amber);color:#241505" onclick="camSkip()">Skip step</button>
      </div>
      <button class="btn ghost block sm" onclick="endCameraGuide()">⏹ End session</button>
    </div>
  </div>

  <!-- Onboarding -->
  <div id="onboard">
    <div class="ob-progress"><i id="ob-bar" style="width:14%"></i></div>
    <div class="ob-body" id="ob-body"></div>
    <div class="ob-foot">
      <button class="btn ghost" id="ob-back" onclick="obBack()">‹ Back</button>
      <button class="btn" id="ob-next" onclick="obNext()">Next</button>
    </div>
  </div>

  <!-- Tutorial -->
  <div id="tutorial">
    <div class="tut-spot" id="tut-spot"></div>
    <div class="tut-card" id="tut-card">
      <h3><span id="tut-title">Welcome</span></h3>
      <div class="tut-dots" id="tut-dots"></div>
      <p id="tut-desc"></p>
      <div class="btnrow">
        <button class="btn ghost sm" onclick="tutPrev()">‹ Back</button>
        <button class="btn sm" onclick="endTutorial()">Skip</button>
        <button class="btn sm" id="tut-next" onclick="tutNext()">Next</button>
      </div>
    </div>
  </div>`;
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
